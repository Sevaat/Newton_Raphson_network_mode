{% extends "base.html" %}
{% block content %}
<h3 class="mb-3">{{ title }}</h3>
<form method="post" enctype="multipart/form-data" style="max-width: 760px">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Сохранить</button>
  <a href="{% if project %}{{ project.get_absolute_url }}{% else %}{% url 'project_list' %}{% endif %}"
     class="btn btn-outline-secondary">Отмена</a>
</form>
{% endblock %}
